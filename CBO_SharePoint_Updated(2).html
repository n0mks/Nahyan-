async function request(url,kind,timeout=25000){

async function inventory(base){

function ensureReader(){

function showMessage(){const section=current(),failed=sections.reduce((all,item)=>all.concat(item.failedLinks),[]),summary=failed.length?failed.length+(failed.length===1?' link failed:':' links failed:')+'\n'+failed.map(name=>'- '+name).join('\n'):'';const text=[loadError,section.error,summary].filter(Boolean).join('\n');ui.message.hidden=!text;ui.message.textContent=text;ui.message.dataset.error=String(!!(loadError||section.error));}

function setBusy(value){busy=value;ui.panel.setAttribute('aria-busy',String(value));ui.refresh.setAttribute('aria-busy',String(value));ui.refresh.querySelector('span').textContent=value?'Refreshing...':'Refresh';[ui.search,ui.clear,ui.refresh,ui.size,ui.prev,ui.next].forEach(el=>el.disabled=value);ui.head.querySelectorAll('button').forEach(el=>el.disabled=value);updateTabs();}

function switchTab(index,focus){if(busy)return;clearTimeout(timer);current().query=ui.search.value;active=index;render();if(focus)$('rcTab-'+current().key).focus();}
