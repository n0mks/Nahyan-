  // Update the visible title text while preserving its anchor and page address.
  const titleKey = value => norm(value).replace(/\s*&\s*/g, '&');
  const previousTitles = new Set([
    'CBO & CMA Circulars Library',
    DEFAULT_SETTINGS.page.pageTitle,
    previousTitle

  const headingSelector = [
    '#pageTitle', '#DeltaPlaceHolderPageTitleInTitleArea',
    '#PlaceHolderPageTitleInTitleArea', '#pageTitle a',
    '#DeltaPlaceHolderPageTitleInTitleArea a', 'h1', 'h2', '[role="heading"]'

  } else if (previousTitle && document.title.includes(previousTitle)) {
    document.title = document.title.replace(previousTitle, () => nextTitle);
  }
}

  const bytes = new Uint8Array(buffer);
  if (bytes[0] !== 80 || bytes[1] !== 75) throw Error('The file is not a valid .xlsx workbook.');
  try {
    const workbook = window.XLSX.read(bytes, {
      type: 'array', cellFormula: true, cellText: true, cellDates: false
    });
    if (!Array.isArray(workbook.SheetNames) || !workbook.Sheets) throw Error('Missing worksheets.');
    return workbook;
  } catch (error) {
    throw Error('The Excel workbook could not be read.');
  }
}

        if (row.linkIssue) section.failedLinks.push(failedLinkName(row));
      }
      section.rows = parsed.rows;
      section.headings = parsed.headings;

}
ui.tabs.addEventListener('click',event=>{const tab=event.target.closest('[data-index]');if(tab)switchTab(Number(tab.dataset.index),false);});
ui.tabs.addEventListener('keydown',event=>{if(!['ArrowRight','ArrowLeft','ArrowDown','ArrowUp','Home','End'].includes(event.key))return;event.preventDefault();switchTab(event.key==='Home'?0:event.key==='End'?sections.length-1:(active+(['ArrowRight','ArrowDown'].includes(event.key)?1:sections.length-1))%sections.length,true);});
ui.search.addEventListener('input',()=>{current().query=ui.search.value;current().page=1;clearTimeout(timer);timer=setTimeout(()=>{if(!busy)render();},140);});
ui.clear.addEventListener('click',()=>{clearTimeout(timer);current().query='';current().page=1;render();ui.search.focus();});
ui.refresh.addEventListener('click',load);
ui.size.addEventListener('change',()=>{current().page=1;render();});
ui.head.addEventListener('click',event=>{const button=event.target.closest('[data-sort]');if(!button||busy)return;const section=current(),key=button.dataset.sort;section.direction=section.sort===key?-section.direction:key==='stamp'?-1:1;section.sort=key;section.page=1;render();ui.head.querySelector('[data-sort="'+key+'"]').focus();});
ui.prev.addEventListener('click',()=>{if(!busy){current().page--;render();}});
ui.next.addEventListener('click',()=>{if(!busy){current().page++;render();}});
render();load();
})();
</script>
